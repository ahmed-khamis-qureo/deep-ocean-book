<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#021726">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>أعماق - رحلة إلى قاع المحيط</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#021726;color:#e8fbff;font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic","Noto Sans Arabic",system-ui,sans-serif;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 12px) 16px 0;display:flex;justify-content:space-between;align-items:flex-start;z-index:5;pointer-events:none}
#depth{font-size:13px;opacity:.85;letter-spacing:.5px}
#depth b{display:block;font-size:30px;font-weight:800;line-height:1;text-shadow:0 0 18px rgba(120,230,255,.7)}
#btns{display:flex;gap:10px;pointer-events:auto}
#btns button{width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-size:18px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#gauge{position:fixed;left:10px;top:50%;transform:translateY(-50%);height:42vh;width:4px;border-radius:2px;background:rgba(255,255,255,.15);z-index:5;pointer-events:none}
#gauge i{position:absolute;left:-4px;width:12px;height:12px;border-radius:50%;background:#7ff0ff;box-shadow:0 0 14px #7ff0ff;top:0;transform:translateY(-50%)}
#stage{position:fixed;inset:0;z-index:3;pointer-events:none}
.ch{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;justify-content:flex-end;padding:0 22px calc(env(safe-area-inset-bottom) + 34px);will-change:transform,opacity;opacity:0}
.ch .zone{font-size:13px;color:#7ff0ff;letter-spacing:1px;margin-bottom:6px}
.ch h2{font-size:clamp(34px,10vw,56px);font-weight:900;line-height:1.1;margin-bottom:12px;text-shadow:0 4px 30px rgba(0,0,0,.6)}
.ch p{font-size:clamp(16px,4.4vw,20px);line-height:1.85;max-width:560px;text-shadow:0 2px 14px rgba(0,0,0,.8);color:#e1f6fb}
.ch .fact{pointer-events:auto;margin-top:16px;align-self:flex-start;padding:11px 18px;border-radius:30px;border:1px solid rgba(127,240,255,.5);background:rgba(2,23,38,.45);color:#bff7ff;font-size:15px;font-family:inherit;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.ch .factbox{max-height:0;overflow:hidden;opacity:0;transition:max-height .5s ease,opacity .5s ease,margin .5s;font-size:15px;line-height:1.8;color:#fff;background:rgba(127,240,255,.12);border-right:3px solid #7ff0ff;border-radius:8px;padding:0 12px}
.ch .factbox.on{max-height:160px;opacity:1;margin-top:12px;padding:10px 12px}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 8px);text-align:center;font-size:12px;opacity:.7;z-index:6;pointer-events:none;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
#start{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 30%,#0b6b8f,#021726 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px;transition:opacity 1s,transform 1s}
#start h1{font-size:clamp(56px,20vw,110px);font-weight:900;text-shadow:0 0 40px rgba(127,240,255,.8)}
#start p{margin:12px 0 30px;font-size:18px;line-height:1.8;opacity:.9}
#start button{padding:16px 40px;border-radius:40px;border:0;font-size:20px;font-weight:800;font-family:inherit;color:#021726;background:linear-gradient(135deg,#7ff0ff,#4fb3ff);box-shadow:0 0 40px rgba(127,240,255,.6);animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
#start small{margin-top:18px;opacity:.6;font-size:13px}
#start.gone{opacity:0;transform:scale(1.4);pointer-events:none}
.up{pointer-events:auto}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stage"></div>
<div id="hud">
  <div id="depth">العمق<b id="dnum">٠ م</b></div>
  <div id="btns"><button id="snd" aria-label="الصوت">🔊</button><button id="vib" aria-label="الاهتزاز">📳</button></div>
</div>
<div id="gauge"><i id="gi"></i></div>
<div id="hint">اسحب لفوق عشان تنزل ⬆</div>
<div id="start">
  <h1>أعماق</h1>
  <p>رحلة في ٦ محطات من سطح المحيط<br>لحد أعمق نقطة في الأرض</p>
  <button id="go">ابدأ الغوص</button>
  <small>يفضل سماعة وتليفون في إيدك، هتحس بالميلان والاهتزاز</small>
</div>
<script>
(function(){
"use strict";
var N2A=function(n){return Math.round(n).toLocaleString('ar-EG')};
var CH=[
{z:"٠ م · السطح",t:"الشمس والموج",d:"إنت واقف على سطح المحيط. المحيطات بتغطي أكتر من ٧٠٪ من الأرض، ومعظمها عمره ما اتشاف. خد نفس عميق، هنغوص.",f:"المحيط بيدينا نص الأكسجين اللي بنتنفسه تقريبًا، من الطحالب الصغيرة اللي بتعيش فيه.",m:0,c:["#37c8f0","#0e6fa8"]},
{z:"٢٠٠ م · منطقة الضوء",t:"آخر الدفا",d:"هنا بيوصل ضوء الشمس، وهنا بتعيش أغلب الكائنات: أسماك، سلاحف، ودلافين. كل متر بننزله الضوء بيقل أكتر.",f:"في عمق ١٠٠ متر تقريبًا، بيفضل حوالي ١٪ بس من ضوء الشمس.",m:200,c:["#0e6fa8","#0a3f6e"]},
{z:"١٠٠٠ م · منطقة الشفق",t:"الضوء بيختفي",d:"الدنيا بقت زرقا غامقة، وده آخر مكان فيه ضوء ضعيف. هنا بتبدأ كائنات تعمل نورها بنفسها، وده اسمه الإضاءة الحيوية.",f:"حوالي ٧٦٪ من كائنات المحيط بتنتج ضوء بنفسها.",m:1000,c:["#0a3f6e","#071f45"]},
{z:"٤٠٠٠ م · منتصف الليل",t:"ظلام تام",d:"مفيش ولا شعاع شمس. الضغط هنا أكبر بحوالي ٤٠٠ مرة من السطح. الكائنات اللي هنا بتصطاد بنورها وبتستنى الأكل ينزلها من فوق.",f:"سمكة أبو شص بتعلّق نور صغير قدام بقها عشان تستدرج فريستها.",m:4000,c:["#071f45","#050f2a"]},
{z:"٦٠٠٠ م · الهاوية",t:"برد وصمت",d:"درجة الحرارة قريبة من الصفر، والضغط هائل. بس لسه فيه حياة: خيار البحر والديدان والقشريات الصغيرة بتعيش على اللي بينزل من فوق زي تلج خفيف.",f:"الفتات اللي بينزل من فوق اسمه «ثلج البحر»، وبياخد أسابيع عشان يوصل القاع.",m:6000,c:["#050f2a","#030a1c"]},
{z:"١٠٩٠٠ م · أعمق نقطة",t:"قاع الأرض",d:"وصلت. خندق ماريانا، أعمق مكان معروف في الأرض. الضغط هنا أكتر من ١٠٠٠ ضعف الضغط على السطح، ومع كده لقوا هنا حياة.",f:"لو وقف جبل إيفرست هنا، قمته هتفضل تحت الماء بأكتر من ٢ كيلومتر.",m:10900,c:["#030a1c","#01040c"]}
];
var N=CH.length;
var stage=document.getElementById('stage');
CH.forEach(function(c,i){
  var e=document.createElement('section');e.className='ch';
  e.innerHTML='<div class="zone">'+c.z+'</div><h2>'+c.t+'</h2><p>'+c.d+'</p>'+
  '<button class="fact">هل تعرف؟</button><div class="factbox">'+c.f+'</div>'+
  (i==N-1?'<button class="fact up" style="margin-top:10px;border-color:#fff;color:#fff">اطلع تاني للسطح ⬆</button>':'');
  stage.appendChild(e);c.el=e;
  var bs=e.querySelectorAll('button');
  bs[0].addEventListener('click',function(ev){ev.stopPropagation();var b=e.querySelector('.factbox');b.classList.toggle('on');buzz([18,40,18]);ping(500+i*90,.5);});
  if(bs[1])bs[1].addEventListener('click',function(ev){ev.stopPropagation();goto(0);});
  [].forEach.call(bs,function(b){b.addEventListener('touchstart',function(ev){ev.stopPropagation()},{passive:true});b.addEventListener('pointerdown',function(ev){ev.stopPropagation()});});
});

var cv=document.getElementById('c'),g=cv.getContext('2d',{alpha:false});
var W=0,H=0,DPR=1;
function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);}
addEventListener('resize',resize);resize();

/* state */
var idx=0,pos=0,vel=0,drag=false,dragY0=0,dragPos0=0,lastY=0,lastT=0,dv=0,moved=0;
var tx=0,ty=0,ttx=0,tty=0;
var soundOn=true,vibOn=true,started=false;

/* audio */
var ac=null,master,lp,drone1,drone2,noiseG,noiseF;
function initAudio(){
  if(ac)return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain();master.gain.value=0;master.connect(ac.destination);
    lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1400;lp.connect(master);
    drone1=ac.createOscillator();drone1.type='sawtooth';drone1.frequency.value=55;
    drone2=ac.createOscillator();drone2.type='sine';drone2.frequency.value=82.6;
    var g1=ac.createGain();g1.gain.value=.10;var g2=ac.createGain();g2.gain.value=.18;
    drone1.connect(g1).connect(lp);drone2.connect(g2).connect(lp);drone1.start();drone2.start();
    var len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0),last=0;
    for(var i=0;i<len;i++){var w=Math.random()*2-1;last=(last+.02*w)/1.02;d[i]=last*3.5;}
    var ns=ac.createBufferSource();ns.buffer=buf;ns.loop=true;
    noiseF=ac.createBiquadFilter();noiseF.type='lowpass';noiseF.frequency.value=700;
    noiseG=ac.createGain();noiseG.gain.value=.5;ns.connect(noiseF).connect(noiseG).connect(master);ns.start();
    master.gain.linearRampToValueAtTime(soundOn?.5:0,ac.currentTime+2);
  }catch(e){ac=null}
}
function ping(f,v){
  if(!ac||!soundOn)return;
  var t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*1.8,t+.12);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.25*(v||1),t+.01);gn.gain.exponentialRampToValueAtTime(.0001,t+.5);
  o.connect(gn).connect(master);o.start(t);o.stop(t+.55);
}
function sonar(){
  if(!ac||!soundOn)return;
  var t=ac.currentTime,o=ac.createOscillator(),gn=ac.createGain(),dl=ac.createDelay(1),fb=ac.createGain();
  o.type='sine';o.frequency.setValueAtTime(420,t);o.frequency.exponentialRampToValueAtTime(300,t+.9);
  gn.gain.setValueAtTime(0,t);gn.gain.linearRampToValueAtTime(.3,t+.03);gn.gain.exponentialRampToValueAtTime(.0001,t+1.3);
  dl.delayTime.value=.35;fb.gain.value=.45;o.connect(gn);gn.connect(master);gn.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(master);
  o.start(t);o.stop(t+1.4);
}
function whoosh(){
  if(!ac||!soundOn)return;
  var t=ac.currentTime;noiseG.gain.cancelScheduledValues(t);noiseG.gain.setValueAtTime(1.4,t);noiseG.gain.exponentialRampToValueAtTime(.5,t+1.2);
}
function audioDepth(p){
  if(!ac)return;var t=ac.currentTime,k=Math.min(1,p/(N-1));
  lp.frequency.setTargetAtTime(1500-1300*k,t,.3);
  noiseF.frequency.setTargetAtTime(900-700*k,t,.3);
  drone1.frequency.setTargetAtTime(58-20*k,t,.5);drone2.frequency.setTargetAtTime(87-30*k,t,.5);
}
function buzz(p){if(vibOn&&navigator.vibrate)try{navigator.vibrate(p)}catch(e){}}

/* particles */
function R(a,b){return a+Math.random()*(b-a)}
var snow=[],bub=[],i;
for(i=0;i<70;i++)snow.push({x:Math.random(),y:Math.random(),z:R(.2,1),s:R(.6,2.2),p:R(0,6.28)});
for(i=0;i<16;i++)bub.push({x:Math.random(),y:Math.random(),r:R(2,7),s:R(.04,.12),p:R(0,6.28)});
var rip=[],fx=[];
var jel=[{x:.28,y:3.45,s:1,p:0},{x:.74,y:2.55,s:.7,p:2},{x:.5,y:4.55,s:1.2,p:4},{x:.2,y:4.9,s:.6,p:1}];
var fish=[];for(i=0;i<22;i++)fish.push({x:Math.random(),y:1+R(-.25,.25),s:R(.7,1.3),sp:R(.03,.06),ph:R(0,6.28)});
var fish0=[];for(i=0;i<10;i++)fish0.push({x:Math.random(),y:R(.35,.8),s:R(.5,1),sp:R(.02,.05),ph:R(0,6.28)});

function lerpC(a,b,t){var A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);var r=(A>>16)+(((B>>16)-(A>>16))*t),gg=((A>>8)&255)+((((B>>8)&255)-((A>>8)&255))*t),bl=(A&255)+(((B&255)-(A&255))*t);return 'rgb('+(r|0)+','+(gg|0)+','+(bl|0)+')'}

function drawJelly(x,y,s,t,ph){
  var w=34*s,h=26*s,pul=Math.sin(t*1.8+ph)*.12;
  g.save();g.translate(x,y);
  var gr=g.createRadialGradient(0,-h*.3,2,0,0,w*1.8);gr.addColorStop(0,'rgba(190,120,255,.5)');gr.addColorStop(1,'rgba(190,120,255,0)');
  g.fillStyle=gr;g.beginPath();g.arc(0,0,w*1.8,0,6.3);g.fill();
  g.fillStyle='rgba(205,150,255,.55)';g.strokeStyle='rgba(235,200,255,.9)';g.lineWidth=1.5;
  g.beginPath();g.moveTo(-w,0);g.quadraticCurveTo(-w*(1+pul),-h*2,0,-h*(1.6+pul));g.quadraticCurveTo(w*(1+pul),-h*2,w,0);g.quadraticCurveTo(0,h*.4,-w,0);g.fill();g.stroke();
  g.strokeStyle='rgba(235,200,255,.55)';
  for(var k=-3;k<=3;k++){g.beginPath();g.moveTo(k*w/3.5,h*.1);for(var j=1;j<=8;j++){g.lineTo(k*w/3.5+Math.sin(t*2+j*.7+k+ph)*6*s,h*.1+j*9*s)}g.stroke();}
  g.restore();
}
function drawFish(x,y,s,t,ph,col,dir){
  g.save();g.translate(x,y);g.scale(dir*s,s);
  var wag=Math.sin(t*6+ph)*3;
  g.fillStyle=col;g.beginPath();g.ellipse(0,0,13,5.5,0,0,6.3);g.fill();
  g.beginPath();g.moveTo(-11,0);g.lineTo(-20,-6+wag);g.lineTo(-20,6+wag);g.closePath();g.fill();
  g.fillStyle='#021726';g.beginPath();g.arc(7,-1,1.2,0,6.3);g.fill();g.restore();
}
function drawAngler(x,y,t){
  g.save();g.translate(x,y);
  var lx=-44,ly=-66+Math.sin(t*2)*4;
  var gr=g.createRadialGradient(lx,ly,1,lx,ly,70);gr.addColorStop(0,'rgba(255,240,150,.95)');gr.addColorStop(.25,'rgba(255,220,90,.35)');gr.addColorStop(1,'rgba(255,220,90,0)');
  g.fillStyle=gr;g.beginPath();g.arc(lx,ly,70,0,6.3);g.fill();
  g.strokeStyle='#27415c';g.lineWidth=2;g.beginPath();g.moveTo(-20,-18);g.quadraticCurveTo(-40,-70,lx,ly);g.stroke();
  g.fillStyle='#16283d';g.beginPath();g.ellipse(10,10,52,38,-.1,0,6.3);g.fill();
  g.beginPath();g.moveTo(52,5);g.lineTo(86,-14);g.lineTo(86,34);g.closePath();g.fill();
  g.fillStyle='#e8fbff';
  for(var k=0;k<6;k++){g.beginPath();g.moveTo(-36+k*8,14);g.lineTo(-33+k*8,25);g.lineTo(-30+k*8,14);g.fill();}
  g.fillStyle='#ffe27a';g.beginPath();g.arc(-20,0,4.5,0,6.3);g.fill();
  g.restore();
}
function drawGlowDot(x,y,r,c){var gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,6.3);g.fill();}
function drawCrab(x,y,s,t){
  g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#ff9a8a';g.strokeStyle='#ff9a8a';g.lineWidth=2;
  g.beginPath();g.ellipse(0,0,16,9,0,0,6.3);g.fill();
  for(var k=-1;k<=1;k+=2){for(var j=0;j<3;j++){g.beginPath();g.moveTo(k*10,2);g.lineTo(k*(20+j*3),8+Math.sin(t*3+j)*2+j*3);g.stroke();}
  g.beginPath();g.arc(k*20,-12,5,0,6.3);g.fill();g.beginPath();g.moveTo(k*10,-4);g.lineTo(k*18,-10);g.stroke();}
  g.restore();
}
function drawAmphi(x,y,t){
  g.save();g.translate(x,y);g.rotate(Math.sin(t)*.1);g.strokeStyle='rgba(200,255,250,.85)';g.fillStyle='rgba(200,255,250,.25)';g.lineWidth=1.5;
  for(var k=0;k<5;k++){g.beginPath();g.ellipse(-k*9,Math.sin(t*3+k)*1.5,8-k*.8,5,0,0,6.3);g.fill();g.stroke();}
  g.restore();
}

var T0=performance.now(),last=T0,visible=true;
document.addEventListener('visibilitychange',function(){visible=!document.hidden;last=performance.now()});

function frame(now){
  requestAnimationFrame(frame);
  if(!visible)return;
  var dt=Math.min(.05,(now-last)/1000);last=now;var t=(now-T0)/1000;
  /* physics */
  if(!drag){
    var target=idx,k=60,c=2*Math.sqrt(k)*.92;
    var a=k*(target-pos)-c*vel;vel+=a*dt;pos+=vel*dt;
  }
  tx+=(ttx-tx)*Math.min(1,dt*5);ty+=(tty-ty)*Math.min(1,dt*5);
  var cp=Math.max(0,Math.min(N-1,pos));
  var i0=Math.floor(cp),i1=Math.min(N-1,i0+1),f=cp-i0;
  /* bg */
  var gr=g.createLinearGradient(0,0,0,H);
  gr.addColorStop(0,lerpC(CH[i0].c[0],CH[i1].c[0],f));gr.addColorStop(1,lerpC(CH[i0].c[1],CH[i1].c[1],f));
  g.fillStyle=gr;g.fillRect(0,0,W,H);
  /* surface light rays */
  var ray=Math.max(0,1-cp/1.6);
  if(ray>0.01){g.save();g.globalAlpha=.16*ray;g.fillStyle='#bff';
    for(var r=0;r<5;r++){var rx=W*(.1+r*.2)+Math.sin(t*.4+r)*30+tx*20;g.beginPath();g.moveTo(rx-20,0);g.lineTo(rx+20,0);g.lineTo(rx+120+tx*30,H);g.lineTo(rx-60+tx*30,H);g.fill();}
    g.restore();
    /* waves */
    var wy=H*.18-pos*H*1.0;
    g.fillStyle='rgba(180,240,255,.3)';g.beginPath();g.moveTo(0,H);g.lineTo(0,wy);
    for(var x=0;x<=W;x+=12)g.lineTo(x,wy+Math.sin(x*.02+t*1.6)*7+Math.sin(x*.045-t*1.1)*4);
    g.lineTo(W,H);g.fill();
  }
  /* world y => screen y */
  function sy(wy){return (wy-pos)*H+H*.38+ty*20}
  /* creatures */
  var y;
  for(i=0;i<fish0.length;i++){var o=fish0[i];if(cp>1.8)break;o.x+=o.sp*dt;if(o.x>1.2)o.x=-.2;
    y=sy(o.y*0.6)+Math.sin(t+o.ph)*6;drawFish(o.x*W+tx*30,y,o.s*1.2,t,o.ph,'rgba(255,230,150,.9)',1);}
  for(i=0;i<fish.length;i++){var o=fish[i];o.x-=o.sp*dt;if(o.x<-.2)o.x=1.2;
    y=sy(o.y)+Math.sin(t*.7+o.ph)*10;if(y<-40||y>H+40)continue;
    drawFish(o.x*W+tx*40,y,o.s,t,o.ph,'rgba(120,200,235,.85)',-1);}
  for(i=0;i<jel.length;i++){var o=jel[i];y=sy(o.y)+Math.sin(t*1.3+o.p)*16;if(y<-120||y>H+160)continue;
    drawJelly(o.x*W+tx*50+Math.sin(t*.5+o.p)*14,y,o.s,t,o.p);}
  y=sy(3);if(y>-150&&y<H+150)drawAngler(W*.62+tx*50+Math.sin(t*.4)*20,y+Math.sin(t*.8)*8,t);
  y=sy(4);if(y>-150&&y<H+150){for(i=0;i<9;i++){var gx=W*(.1+i*.1)+Math.sin(t*.3+i)*20+tx*30,gy=y+Math.sin(t*.9+i*2)*50+(i%3)*40-40;drawGlowDot(gx,gy,18,i%2?'rgba(120,255,200,.7)':'rgba(120,200,255,.7)');}}
  y=sy(4.15);if(y>-80&&y<H+80){drawCrab(W*.3+Math.sin(t*.5)*40+tx*30,y+H*.2,1.1,t)}
  y=sy(5);if(y>-120&&y<H+120){drawAmphi(W*.7+Math.sin(t*.4)*30+tx*40,y,t);drawAmphi(W*.3+Math.cos(t*.3)*30+tx*40,y+90,t+2);
    var pr=(Math.sin(t*3)+1)*.5;drawGlowDot(W*.5,y-60,70+pr*20,'rgba(255,90,90,.12)');}
  /* marine snow */
  var sp=vel*.9;
  g.fillStyle='#d8f6ff';
  for(i=0;i<snow.length;i++){var s=snow[i];
    s.y-= (sp*s.z*.9 - .04*dt*s.z*(.4+cp*.3));
    s.x+=Math.sin(t*.5+s.p)*.0004;
    if(s.y<-.05)s.y+=1.1;if(s.y>1.05)s.y-=1.1;
    g.globalAlpha=.25+s.z*.5;g.beginPath();g.arc(s.x*W+tx*40*s.z+W*.0,s.y*H+ty*20*s.z,s.s*s.z,0,6.3);g.fill();}
  g.globalAlpha=1;
  /* bubbles rising (upper zones) */
  if(cp<3){g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1.2;
    for(i=0;i<bub.length;i++){var b=bub[i];b.y-=b.s*dt+sp*.6;if(b.y<-.05){b.y=1.05;b.x=Math.random()}if(b.y>1.1)b.y=-.05;
      g.globalAlpha=Math.max(0,1-cp/3);g.beginPath();g.arc(b.x*W+Math.sin(t*2+b.p)*8+tx*30,b.y*H,b.r,0,6.3);g.stroke();}
    g.globalAlpha=1;}
  /* ripples & fx */
  for(i=rip.length-1;i>=0;i--){var q=rip[i];q.a-=dt*1.2;q.r+=dt*160;if(q.a<=0){rip.splice(i,1);continue}
    g.strokeStyle='rgba(160,245,255,'+q.a+')';g.lineWidth=2;g.beginPath();g.arc(q.x,q.y,q.r,0,6.3);g.stroke();}
  for(i=fx.length-1;i>=0;i--){var q=fx[i];q.l-=dt;if(q.l<=0){fx.splice(i,1);continue}q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy-=20*dt;
    g.strokeStyle='rgba(255,255,255,'+q.l+')';g.beginPath();g.arc(q.x,q.y,q.r,0,6.3);g.stroke();}
  var sc=g.createLinearGradient(0,H*.38,0,H);sc.addColorStop(0,'rgba(0,10,25,0)');sc.addColorStop(1,'rgba(0,10,25,'+(.55)+')');g.fillStyle=sc;g.fillRect(0,H*.38,W,H*.62);
  /* vignette deeper */
  var vg=g.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,'+(.25+cp/(N-1)*.4)+')');
  g.fillStyle=vg;g.fillRect(0,0,W,H);
  /* chapters ui */
  for(i=0;i<N;i++){var d=pos-i,ad=Math.abs(d),e=CH[i].el;
    if(ad>1.2){if(e._v!==0){e.style.opacity=0;e._v=0;e.style.visibility='hidden'}continue}
    e.style.visibility='visible';e._v=1;
    var op=Math.max(0,1-ad*1.35);
    e.style.opacity=op.toFixed(3);
    e.style.transform='translate3d(0,'+(d*-H*.5).toFixed(1)+'px,0) scale('+(1-ad*.08).toFixed(3)+')';
  }
  /* hud */
  var depth=0;
  for(i=0;i<N-1;i++){if(cp>=i&&cp<=i+1){depth=CH[i].m+(CH[i+1].m-CH[i].m)*(cp-i);break}}
  if(cp>=N-1)depth=CH[N-1].m;
  dnum.textContent=N2A(depth)+' م';
  gi.style.top=(cp/(N-1)*100)+'%';
  audioDepth(cp);
}
var dnum=document.getElementById('dnum'),gi=document.getElementById('gi');
requestAnimationFrame(frame);

function goto(n){
  n=Math.max(0,Math.min(N-1,n));if(n===idx)return;
  idx=n;whoosh();
  ping(260+n*40,.6);
  if(n>=N-1){sonar();buzz([60,80,60,80,200]);}else buzz(25);
  document.getElementById('hint').style.display='none';
  [].forEach.call(document.querySelectorAll('.factbox.on'),function(b){b.classList.remove('on')});
}
window.__goto=goto;

/* input */
var hintEl=document.getElementById('hint');
function down(y){if(!started)return;drag=true;dragY0=y;dragPos0=pos;lastY=y;lastT=performance.now();dv=0;moved=0;vel=0}
function move(y){if(!drag)return;var n=performance.now();var dy=y-lastY;moved+=Math.abs(dy);
  pos=dragPos0+(dragY0-y)/H*1.0;pos=Math.max(-.15,Math.min(N-1+.15,pos));
  var dtm=Math.max(1,n-lastT);dv=.8*dv+.2*(-dy/H/dtm*1000);lastY=y;lastT=n;}
function up(y,tap){if(!drag)return;drag=false;
  var tot=(dragY0-y);
  if(Math.abs(tot)<8&&moved<12){ // tap
    rip.push({x:tapX,y:y,r:6,a:.9});ping(300+Math.random()*500,.5);buzz(12);
    for(var k=0;k<6;k++)fx.push({x:tapX,y:y,vx:R(-40,40),vy:R(-60,-10),r:R(2,5),l:R(.6,1.2)});
    vel=0;return;}
  var flick=dv;
  if(tot>H*.12||flick>.8)goto(idx+1);else if(tot<-H*.12||flick<-.8)goto(idx-1);
  vel=Math.max(-3,Math.min(3,dv*.6));
}
var tapX=0;
cv.addEventListener('touchstart',function(e){var t=e.touches[0];tapX=t.clientX;down(t.clientY)},{passive:true});
document.addEventListener('touchstart',function(e){if(e.target===document.body||e.target===stage){var t=e.touches[0];tapX=t.clientX;if(!drag)down(t.clientY)}},{passive:true});
addEventListener('touchmove',function(e){move(e.touches[0].clientY);if(e.cancelable)e.preventDefault()},{passive:false});
addEventListener('touchend',function(e){var t=e.changedTouches[0];up(t.clientY)});
addEventListener('touchcancel',function(){drag=false});
var mouseDown=false;
cv.addEventListener('mousedown',function(e){mouseDown=true;tapX=e.clientX;down(e.clientY)});
addEventListener('mousemove',function(e){if(mouseDown)move(e.clientY);if(!hasTilt){ttx=(e.clientX/W-.5)*2;tty=(e.clientY/H-.5)*2}});
addEventListener('mouseup',function(e){if(mouseDown){mouseDown=false;up(e.clientY)}});
var wheelLock=0;
addEventListener('wheel',function(e){if(!started)return;var n=performance.now();if(n<wheelLock)return;if(Math.abs(e.deltaY)>10){wheelLock=n+700;goto(idx+(e.deltaY>0?1:-1))}},{passive:true});
addEventListener('keydown',function(e){if(!started)return;if(e.key==='ArrowDown'||e.key==='ArrowUp'||e.key===' '||e.key==='PageDown'||e.key==='PageUp'){e.preventDefault();goto(idx+((e.key==='ArrowUp'||e.key==='PageUp')?-1:1))}});

/* tilt */
var hasTilt=false;
function onTilt(e){if(e.gamma==null)return;hasTilt=true;
  ttx=Math.max(-1,Math.min(1,e.gamma/25));tty=Math.max(-1,Math.min(1,((e.beta||45)-50)/25));}
function enableTilt(){
  try{
    if(window.DeviceOrientationEvent&&typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(function(r){if(r==='granted')addEventListener('deviceorientation',onTilt)}).catch(function(){});
    }else addEventListener('deviceorientation',onTilt);
  }catch(e){}
}

/* buttons */
var sb=document.getElementById('snd'),vb=document.getElementById('vib');
function stop(e){e.stopPropagation()}
[sb,vb].forEach(function(b){b.addEventListener('touchstart',stop,{passive:true});b.addEventListener('mousedown',stop)});
sb.addEventListener('click',function(){soundOn=!soundOn;sb.textContent=soundOn?'🔊':'🔇';if(ac)master.gain.setTargetAtTime(soundOn?.5:0,ac.currentTime,.1);if(soundOn&&ac&&ac.state==='suspended')ac.resume();});
vb.addEventListener('click',function(){vibOn=!vibOn;vb.style.opacity=vibOn?1:.4;if(vibOn)buzz(40)});
document.addEventListener('visibilitychange',function(){if(!ac)return;if(document.hidden)ac.suspend();else if(soundOn)ac.resume()});

document.getElementById('go').addEventListener('click',function(){
  started=true;initAudio();if(ac&&ac.state==='suspended')ac.resume();enableTilt();
  document.getElementById('start').classList.add('gone');
  buzz([30,60,30]);setTimeout(function(){ping(330,.8)},300);
  var el=document.documentElement;if(el.requestFullscreen&&matchMedia('(pointer:coarse)').matches)try{el.requestFullscreen({navigationUI:'hide'}).catch(function(){})}catch(e){}
});
if('serviceWorker' in navigator)addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
